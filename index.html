
<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GhostNode - Downloads</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Vercel Analytics -->

    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>

    <script
        defer
        src="/_vercel/insights/script.js">
    </script>

</head>


<body>


    <!-- ==========================
         HEADER
    =========================== -->

    <header class="header">

        <div class="logo">
            GhostNode
        </div>


        <input
            type="search"
            id="search"
            class="search"
            placeholder="Pesquisar ficheiros..."
            autocomplete="off"
        >


        <button
            id="themeButton"
            class="theme-button"
            type="button"
            title="Alterar tema"
            aria-label="Alterar tema"
        >

            ☼

        </button>

    </header>



    <!-- ==========================
         CATEGORIAS
    =========================== -->

    <nav
        class="categories"
        aria-label="Categorias"
    >

        <button
            class="category active"
            data-category="Todos"
            type="button"
        >

            Todos

        </button>


        <button
            class="category"
            data-category="Arquivos"
            type="button"
        >

            📄 Arquivos

        </button>


        <button
            class="category"
            data-category="Códigos"
            type="button"
        >

            &lt;/&gt; Códigos

        </button>


        <button
            class="category"
            data-category="Apps"
            type="button"
        >

            ▣ Apps

        </button>


        <button
            class="category"
            data-category="Vídeos"
            type="button"
        >

            ▶ Vídeos

        </button>


        <button
            class="category"
            data-category="Outros"
            type="button"
        >

            ••• Outros

        </button>

    </nav>



    <!-- ==========================
         CONTEÚDO
    =========================== -->

    <main>

        <div
            id="downloads"
            class="downloads"
        ></div>


        <div
            id="noResults"
            class="no-results"
        >

            Nenhum ficheiro encontrado.

        </div>

    </main>



    <!-- ==========================
         FOOTER
    =========================== -->

    <footer>

        GhostNode © 2026

    </footer>



    <!-- ==========================
         JAVASCRIPT DO SITE
    =========================== -->

    <script src="script.js"></script>



    <!-- ==========================
         SCRIPT EXTERNO
         (Publicidade)
    =========================== -->

    <script src="https://pl31124570.profitableratecpmnetwork.com/5c/8b/70/5c8b7073744cdfa680166b43d205aa8b.js"></script>


</body>

</html>
