<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GhostNode - Downloads</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        GhostNode
    </div>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Buscar..."
    >

    <button id="themeButton" class="theme-button">
        ⚙
    </button>

</header>


<nav class="categories">

    <button class="category active" data-category="Todos">
        Todos
    </button>

    <button class="category" data-category="Arquivos">
        📄 Arquivos
    </button>

    <button class="category" data-category="Códigos">
        🔑 Códigos
    </button>

    <button class="category" data-category="Apps">
        📱 Apps
    </button>

    <button class="category" data-category="Vídeos">
        🎥 Vídeos
    </button>

    <button class="category" data-category="Outros">
        ••• Outros
    </button>

</nav>


<main>

    <div id="downloads" class="downloads"></div>

    <div id="noResults" class="no-results">
        Nenhum ficheiro encontrado.
    </div>

</main>


<footer>

    GhostNode © 2026

</footer>


<script src="script.js"></script>

</body>
</html>
